<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <h2 style="text-align:center;margin-top:40px;">Online Exam System</h2>

    <div class="auth-container">

        <h2>Register</h2>

        <form id="registerForm">

            <input id="name" placeholder="Name" required>
            <input id="email" placeholder="Email" required>

            <div class="password-box">
                <input type="password" id="password" placeholder="Password">
                <i class="fa fa-eye toggle-password" onclick="togglePassword(this,'password')"></i>
            </div>

            <div id="strengthText"></div>

            <div class="password-box">
                <input type="password" id="confirmPassword" placeholder="Confirm Password">
                <i class="fa fa-eye toggle-password" onclick="togglePassword(this,'confirmPassword')"></i>
            </div>

            <select id="role">
                <option value="" disabled selected>Role</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Admin</option>
            </select>

            <button id="registerBtn">Register</button>

            <div class="loader" id="loader"></div>
            <p class="error" id="errorMsg"></p>

        </form>
        <p>Already have an account? <a href="login.html">Login</a></p>

    </div>

    <div id="successPopup">Registered Successfully!</div>

    <script src="js/register.js"></script>
</body>

</html>
