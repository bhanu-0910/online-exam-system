<!DOCTYPE html>
<html>

<head>
    <title>My Attempts</title>
    <link rel="stylesheet" href="../css/style.css">

    <!-- ICONS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="main">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>Student</h3>

        <a href="dashboard.html">
            <i class="fa fa-home"></i> Home
        </a>

        <a href="Available_exam.html">
            <i class="fa fa-book"></i> Available Exams
        </a>

        <a href="My_attempts.html" class="active">
            <i class="fa fa-history"></i> My Attempts
        </a>

        <a href="Performence.html">
            <i class="fa fa-chart-bar"></i> Performance
        </a>

        <a href="#" onclick="logout()">
            <i class="fa fa-sign-out-alt"></i> Logout
        </a>
    </div>

    <!-- CONTENT -->
    <div class="content">

        <h2>My Attempts</h2>

        <div  id="historyGrid" class="attempt-list"></div>

    </div>

</div>

<script>

let user_id = localStorage.getItem("user_id");

/* LOAD ATTEMPTS */
async function loadAttempts() {

    let results = await (await fetch(`http://localhost:5000/results/${user_id}`)).json();
    let exams = await (await fetch("http://localhost:5000/exams")).json();

    let grid = document.getElementById("historyGrid");
    grid.innerHTML = "";

    if(results.length === 0){
        grid.innerHTML = "No attempts yet";
        return;
    }

    results.forEach(r => {

        let exam = exams.find(e => e.id == r.exam_id);

        grid.innerHTML += `
        <div class="history-card">
            <h4>${exam ? exam.title : "Unknown Exam"}</h4>
            <p>Score: ${r.score}</p>
        </div>`;
    });
}

/* LOGOUT */
function logout() {
    localStorage.clear();
    window.location.href = "../login.html";
}

loadAttempts();

</script>

</body>
</html>
