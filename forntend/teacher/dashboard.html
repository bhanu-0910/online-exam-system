<!DOCTYPE html>
<html>

<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- CALENDAR -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
</head>

<body>

    <div class="main">

        <div class="sidebar">
            <h3>Teacher</h3>
            <a href="dashboard.html" class="active"><i class="fa fa-home"></i> Dashboard</a>
            <a href="question-bank.html"><i class="fa fa-book"></i> Question Bank</a>
            <a href="create-exam.html"><i class="fa fa-pen"></i> Create Exam</a>
            <a href="schedule.html"><i class="fa fa-clock"></i> Schedule</a>
            <a href="results.html"><i class="fa fa-chart-bar"></i> Results</a>
            <a href="../login.html"><i class="fa fa-sign-out-alt"></i> Logout</a>
        </div>

        <div class="content">

            

            <h2>Teacher Dashboard</h2>

            <div class="cards">

                <div class="card-box">
                    <h3 id="examCount">0</h3>
                    <p>Total Exams</p>
                </div>

                <div class="card-box">
                    <h3 id="questionCount">0</h3>
                    <p>Total Questions</p>
                </div>

                <div class="card-box">
                    <h3 id="studentCount">0</h3>
                    <p>Students</p>
                </div>

            </div>

            <div class="card" style="margin-top:30px;">
                <p>Manage exams, questions, and schedules easily.</p>
            </div>

            <div class="dashboard-cards">

        <div class="dash-card">
            <h3><i class="fa fa-bell"></i> Latest Updates</h3>
            <p>No new updates</p>
        </div>

        <div class="dash-card">
            <h3><i class="fa fa-calendar"></i> Upcoming Exams</h3>
            <p>No exams scheduled</p>
        </div>

        <div class="dash-card">
            <h3><i class="fa fa-clock"></i> Calendar</h3>
            <div id="calendar"></div>
        </div>

        </div>
    </div>

    <script>
        async function loadDashboard() {

            let exams = await (await fetch("http://localhost:5000/exams")).json();
            document.getElementById("examCount").innerText = exams.length;

            let users = await (await fetch("http://localhost:5000/users")).json();
            let students = users.filter(u => u.role === "student");
            document.getElementById("studentCount").innerText = students.length;

            // optional (safe fallback)
            document.getElementById("questionCount").innerText = "-";
        }

        loadDashboard();
document.addEventListener('DOMContentLoaded', function () {

    let calendarEl = document.getElementById('calendar');

    let calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',

        height: 300,

        events: [
            { title: 'Exam 1', date: '2026-05-10' },
            { title: 'Exam 2', date: '2026-05-15' }
        ]
    });

    calendar.render();
});

        
    </script>

</body>

</html>
