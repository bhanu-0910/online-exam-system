<!DOCTYPE html>
<html>
<head>
    <title>Question Bank</title>
    <link rel="stylesheet" href="../css/style.css">

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>

<body>
    <div class="sidebar">
            <h3>Teacher</h3>
            <a href="dashboard.html" class="active"><i class="fa fa-home"></i> Dashboard</a>
            <a href="question-bank.html"><i class="fa fa-book"></i> Question Bank</a>
            <a href="create-exam.html"><i class="fa fa-pen"></i> Create Exam</a>
            <a href="schedule.html"><i class="fa fa-clock"></i> Schedule</a>
            <a href="results.html"><i class="fa fa-chart-bar"></i> Results</a>
            <a href="../login.html"><i class="fa fa-sign-out-alt"></i> Logout</a>
        </div>


<div class="content">

    <h2>Question Bank</h2>

    <select id="examSelect"></select>
    <p id="examTypeLabel"></p>

    <!-- PDF Upload -->
    <input type="file" id="pdfInput">
    <button onclick="processPDF()">Upload PDF & Auto Fill</button>

    <!-- MCQ -->
    <input id="questionInput" placeholder="Question">

    <div id="editorBox" style="display:none;">
        <div id="editor" style="height:120px;"></div>
    </div>

    <div id="mcqBox">
        <input id="aInput" placeholder="Option A">
        <input id="bInput" placeholder="Option B">
        <input id="cInput" placeholder="Option C">
        <input id="dInput" placeholder="Option D">
        <input id="correctInput" placeholder="Correct Answer">
    </div>

    <!-- Coding -->
    <div id="codingBox" style="display:none;">
        <select id="language">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
        </select>

        <input id="test_input" placeholder="Test Input">
        <input id="expected_output" placeholder="Expected Output">
    </div>

    <button id="mainBtn" onclick="addOrUpdate()">Add Question</button>

    <h3>Questions</h3>
    <ul id="questionList"></ul>

</div>

<script>

let exams = [];
let selectedType = "MCQ";
let editId = null;

let quill = new Quill('#editor', { theme: 'snow' });

/* LOAD EXAMS */
async function loadExams() {
    exams = await (await fetch("http://localhost:5000/exams")).json();

    let select = document.getElementById("examSelect");
    select.innerHTML = "";

    exams.forEach(e => {
        select.innerHTML += `<option value="${e.id}">${e.title}</option>`;
    });

    updateForm();
}

/* UPDATE FORM */
function updateForm() {

    let id = examSelect.value;
    let exam = exams.find(e => e.id == id);

    selectedType = exam.type || "MCQ";

    examTypeLabel.innerText = "Type: " + selectedType;

    if (selectedType === "MCQ") {
        questionInput.style.display = "block";
        mcqBox.style.display = "block";
        editorBox.style.display = "none";
        codingBox.style.display = "none";
    }
    else if (selectedType === "Subjective") {
        questionInput.style.display = "none";
        mcqBox.style.display = "none";
        editorBox.style.display = "block";
        codingBox.style.display = "none";
    }
    else if (selectedType === "Coding") {
        questionInput.style.display = "none";
        mcqBox.style.display = "none";
        editorBox.style.display = "block";
        codingBox.style.display = "block";
    }

    loadQuestions();
}

/* ADD / UPDATE */
async function addOrUpdate() {

    let exam_id = examSelect.value;

    let question = selectedType === "MCQ"
        ? questionInput.value
        : quill.root.innerHTML;

    let a="", b="", c="", d="", correct="";
    let language="", test_cases=null;

    if (selectedType === "MCQ") {
        a = aInput.value;
        b = bInput.value;
        c = cInput.value;
        d = dInput.value;
        correct = correctInput.value;
    }

    if (selectedType === "Coding") {
        let input = test_input.value;
        let expected = expected_output.value;
        language = document.getElementById("language").value;

        test_cases = JSON.stringify([{input, expected}]);
    }

    if (!question) return alert("Enter question");

    if (editId) {

        await fetch(`http://localhost:5000/update-question/${editId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question,a,b,c,d,correct,language,test_cases })
        });

        alert("Updated");
        editId=null;
        mainBtn.innerText="Add Question";

    } else {

        await fetch("http://localhost:5000/add-question", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ exam_id,question,a,b,c,d,correct,language,test_cases })
        });

        alert("Added");
    }

    clearForm();
    loadQuestions();
}

/* LOAD QUESTIONS */
async function loadQuestions() {

    let id = examSelect.value;

    let data = await (await fetch(`http://localhost:5000/questions/${id}`)).json();

    let list = questionList;
    list.innerHTML = "";

    if (!data.length) return list.innerHTML="<li>No questions</li>";

    data.forEach(q=>{
        list.innerHTML+=`
        <li style="color:${q.correct ? 'black':'red'}">
            ${q.question}
            ${!q.correct ? '(Answer Missing)' : ''}
            <button onclick="editQuestion(${q.id})">Edit</button>
            <button onclick="deleteQuestion(${q.id})">Delete</button>
        </li>`;
    });
}

/* DELETE */
async function deleteQuestion(id){
    await fetch(`http://localhost:5000/delete-question/${id}`,{method:"DELETE"});
    loadQuestions();
}

/* EDIT */
async function editQuestion(id){

    let exam_id = examSelect.value;
    let data = await (await fetch(`http://localhost:5000/questions/${exam_id}`)).json();

    let q = data.find(x=>x.id==id);

    if(selectedType==="MCQ"){
        questionInput.value=q.question;
    }else{
        quill.root.innerHTML=q.question;
    }

    aInput.value=q.optionA||"";
    bInput.value=q.optionB||"";
    cInput.value=q.optionC||"";
    dInput.value=q.optionD||"";
    correctInput.value=q.correct||"";

    if(q.test_cases){
        let tc=JSON.parse(q.test_cases);
        test_input.value=tc[0]?.input||"";
        expected_output.value=tc[0]?.expected||"";
    }

    language.value=q.language||"javascript";

    editId=id;
    mainBtn.innerText="Update Question";
}

/* CLEAR */
function clearForm(){
    questionInput.value="";
    quill.root.innerHTML="";
    aInput.value=bInput.value=cInput.value=dInput.value=correctInput.value="";
    test_input.value=expected_output.value="";
}

/* ================= PDF ================= */

async function processPDF(){

    let file = pdfInput.files[0];
    if(!file) return alert("Select PDF");

    let buffer = await file.arrayBuffer();
    let pdf = await pdfjsLib.getDocument({data:buffer}).promise;

    let text="";

    for(let i=1;i<=pdf.numPages;i++){
        let page=await pdf.getPage(i);
        let content=await page.getTextContent();
        text+=content.items.map(i=>i.str).join(" ")+"\n";
    }

    autoFill(text);
}

/* MULTI QUESTION PARSER */
function autoFill(text){

    text = text.replace(/\s+/g," ").trim();

    let questions = text.split(/Q\.?\s?\d+/i).filter(q => q.trim() !== "");

    let saved = 0, pending = 0;

    questions.forEach(async (qText) => {

        let match = qText.match(/(.*?)(A[\)\.]|A\s)(.*?)(B[\)\.]|B\s)(.*?)(C[\)\.]|C\s)(.*?)(D[\)\.]|D\s)(.*)/i);

        if (!match) return;

        let question = match[1].trim();
        let a = match[3].trim();
        let b = match[5].trim();
        let c = match[7].trim();
        let d = match[9].trim();

        let correctMatch = qText.match(/\(([ABCD])\)/);
        let correct = correctMatch ? correctMatch[1] : "";

        let exam_id = examSelect.value;

        await fetch("http://localhost:5000/add-question", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({exam_id,question,a,b,c,d,correct})
        });

        correct ? saved++ : pending++;

    });

    alert(`Imported: ${saved} with answers | ${pending} pending`);

    loadQuestions();
}

/* INIT */
examSelect.addEventListener("change", updateForm);
loadExams();

</script>

</body>
</html>
